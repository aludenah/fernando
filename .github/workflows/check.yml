name: Comprobar el aula

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias de comprobación
        run: npm ci --ignore-scripts
      - name: Verificar JavaScript y contenido
        run: |
          node --check docs/app.js
          node --check docs/math.js
          node --check docs/grading.js
          node --check docs/grading-views.js
          node --check docs/sequence.js
          node --check docs/model.js
          node --check docs/store.js
          node --check docs/sync.js
          node --check docs/sync-protocol.js
          node scripts/build-progress-service.mjs --check
          node --check docs/students.js
          node --check docs/competition-views.js
          node --check docs/course-views.js
          node --check docs/drive.js
          node --check docs/progress.js
          node --check docs/family-views.js
          npm test
          npm run check
