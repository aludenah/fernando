name: Comprobar el aula

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias de comprobación
        run: npm ci --ignore-scripts
      - name: Verificar JavaScript y contenido
        run: |
          node --check docs/app.js
          node --check docs/activities.js
          node --check docs/html.js
          node --check docs/matrices.js
          node --check docs/matrices-app.js
          node --check docs/activity-report.js
          node --check docs/report-pdf.js
          node --check docs/math.js
          npm test
          npm run check
